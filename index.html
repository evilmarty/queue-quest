<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Join a peer-to-peer queue and wait your turn."
    />
    <meta name="theme-color" content="#090b20" />
    <!--
      Vite rewrites %BASE_URL% to the deployment base, which is / locally and
      /queue-quest/ on GitHub Pages. Paths inside the manifest are relative to
      the manifest itself, so they follow either base without templating.
    -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <title>Queue Quest</title>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
