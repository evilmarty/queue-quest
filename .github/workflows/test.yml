name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build
        # No TURN secrets here: PRs from forks cannot access repository
        # secrets, and this workflow only verifies the app builds and its
        # tests pass, not that it deploys.
        run: npm run build
